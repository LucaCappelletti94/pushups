[package]
name = "pushups-winit-example"
description = "A winit app receiving pushes through pushups, used for the device proofs"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# The Android build, which `NativeActivity` loads as `libmain.so`. It is empty on other targets.
[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
futures-executor = "0.3"
pushups = { path = "../.." }
serde_json = "1"
winit = "=0.31.0-beta.3"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "=0.31.0-beta.3", features = ["android-native-activity"] }

[workspace]

# winit's Android loop ignores `Destroy` and allows one loop per process, so a relaunched Activity
# freezes its main thread (winit#4303). The fix's PR head, until a winit release carries it.
[patch.crates-io]
winit = { git = "https://github.com/LucaCappelletti94/winit", rev = "aedb05bb" }
