[package]
name = "pushups-winit-example"
description = "A winit app receiving pushes through pushups, used for the device proofs"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# The Android build, which `NativeActivity` loads as `libmain.so`. It is empty on other targets.
[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
pushups = { path = "../..", features = ["serde"] }
pushups-example-support = { path = "../support" }
# Puts the drawn pixels in the window, which winit itself leaves empty.
softbuffer = "0.4"
winit = "=0.31.0-beta.3"

# Blocks on the permission prompt on a thread of its own, which the web cannot do.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-executor = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "=0.31.0-beta.3", features = ["android-native-activity"] }
# The web build, which `Trunk` starts from `index.html` and which `build.rs` writes its worker beside.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "Window"] }

[workspace]

# The build script writes the static worker for Trunk to copy.
[build-dependencies]
pushups = { path = "../.." }

# winit's Android loop ignores `Destroy` and allows one loop per process, so a relaunched Activity
# freezes its main thread (winit#4303). The fix's PR head, until a winit release carries it.
[patch.crates-io]
winit = { git = "https://github.com/LucaCappelletti94/winit", rev = "aedb05bb" }
