[package]
name = "pushups-dioxus-example"
description = "A Dioxus app receiving pushes through pushups, used for the device proofs"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
dioxus = "0.7.10"
futures-util = { version = "0.3", default-features = false }
pushups = { path = "../..", features = ["stream"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# Bundles the crate's Gradle module into the APK.
manganis = "0.7.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[workspace]
