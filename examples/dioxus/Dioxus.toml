[application]
name = "pushups-dioxus-example"

[web.app]
title = "pushups example"

[bundle]
identifier = "rs.pushups.example"
publisher = "pushups"
# Rendered by assets/brand/render.sh. `dx` builds every macOS icon size from the first PNG, so the largest leads.
icon = [
    "../../assets/brand/png/icon-macos-1024.png",
    "../../assets/brand/png/icon-macos-512.png",
    "../../assets/brand/png/icon-macos-256.png",
    "../../assets/brand/png/icon-macos-128.png",
    "../../assets/brand/png/icon-macos-32.png",
]

# APNs, for the iOS build.
[ios.entitlements]
aps-environment = "development"

[background]
remote-notifications = true

# APNs, for the macOS build, whose entitlement name differs from iOS's.
[macos.entitlements]
"com.apple.developer.aps-environment" = "development"
