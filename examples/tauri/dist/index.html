<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>pushups Tauri example</title>
        <style>
            html { background: #0e1824; }
            body { margin: 0; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px; background: #0e1824; color: #f5f7fa; font-family: system-ui, sans-serif; }
            h2 { margin: 0 0 16px; color: #f67017; }
            button { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: #ffffff; padding: 10px 16px; border: none; border-radius: 10px; background: linear-gradient(135deg, #fa1e13, #f67017); }
            p { margin: 0 0 8px; overflow-wrap: anywhere; }
        </style>
    </head>
    <body>
        <h2>pushups Tauri example</h2>
        <!-- Asks for the notification permission from Rust, which the prompt needs from a gesture. -->
        <button id="allow" onclick="ask()">Allow notifications</button>
        <p id="permission"></p>
        <div id="lines"></div>
        <script>
            // The Rust side calls this through `eval` for every line, the earlier ones once the page has loaded.
            function pushupsShow(text) {
                const line = document.createElement("p");
                line.textContent = text;
                document.getElementById("lines").append(line);
            }
            // Shows the permission Rust reports, hiding the ask while it no longer can change it.
            function applyPermission(permission) {
                document.getElementById("allow").style.display = permission.asks ? "" : "none";
                document.getElementById("permission").textContent = permission.label;
            }
            function ask() {
                window.__TAURI__.core.invoke("allow").then(applyPermission);
            }
            // The permission Rust holds, which the page re-reads when it comes back to the foreground.
            (async () => {
                const refresh = () => window.__TAURI__.core.invoke("status").then(applyPermission);
                applyPermission(await window.__TAURI__.core.invoke("status"));
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "visible") {
                        refresh();
                    }
                });
                window.addEventListener("focus", refresh);
            })();
        </script>
    </body>
</html>
