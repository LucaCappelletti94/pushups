[package]
name = "pushups-yew-example"
description = "A Yew app built with Trunk, receiving pushes through pushups, used for the bundler proofs"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false }
pushups = { path = "../..", features = ["stream", "serde"] }
pushups-example-support = { path = "../support" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "VisibilityState", "Window"] }
yew = { version = "0.23", features = ["csr"] }

# The build script writes the static worker for Trunk to copy.
[build-dependencies]
pushups = { path = "../.." }

[workspace]
