[package]
name = "pushups-leptos-example"
description = "A Leptos SSR app built with cargo-leptos, receiving pushes through pushups, used for the bundler proofs"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", optional = true }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
leptos = "0.8.22"
leptos_axum = { version = "0.8.10", optional = true }
leptos_router = "0.8.17"
pushups = { path = "../..", features = ["stream"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = ["console"] }

[features]
hydrate = ["leptos/hydrate"]
ssr = ["dep:axum", "dep:tokio", "dep:leptos_axum", "leptos/ssr", "leptos_router/ssr"]

[package.metadata.leptos]
output-name = "pushups-leptos-example"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[workspace]
