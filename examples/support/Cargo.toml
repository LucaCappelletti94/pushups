[package]
name = "pushups-example-support"
description = "The shared instrumentation helpers of the pushups examples, used for the device proofs"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The 8×8 bitmap font the native examples draw their window's lines in.
font8x8 = "0.3"
pushups = { path = "../..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The local clock for the push's arrival time, from the system offset and `js_sys::Date` on the
# web.
time = { version = "0.3", features = ["local-offset"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
time = { version = "0.3", features = ["local-offset", "wasm-bindgen"] }
web-sys = { version = "0.3", features = ["console"] }

[workspace]
