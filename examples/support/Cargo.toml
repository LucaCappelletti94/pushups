[package]
name = "pushups-example-support"
description = "The shared instrumentation helpers of the pushups examples, used for the device proofs"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The 8×8 bitmap font the native examples draw their window's lines in.
font8x8 = "0.3"
pushups = { path = "../..", features = ["serde"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[workspace]
