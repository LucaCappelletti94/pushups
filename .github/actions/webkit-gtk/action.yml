name: WebKitGTK
description: The GTK and WebKitGTK development packages Tauri builds against on Linux, downloaded once per runner image

runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: |
        echo "prefix=webkit-gtk-$ImageOS-" >> "$GITHUB_OUTPUT"
        echo "key=webkit-gtk-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    # The runner's Ubuntu mirror has served these 46 MB at under 30 kB/s, past the job limits.
    - uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: ${{ steps.image.outputs.key }}
        restore-keys: ${{ steps.image.outputs.prefix }}
    - shell: bash
      run: |
        mkdir -p ~/apt-archives/partial
        sudo apt-get update
        sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
        sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-archives"
        sudo chown -R "$USER" ~/apt-archives
