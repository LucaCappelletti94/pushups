---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - upstream/mobile-notification-rendering

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.10"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check
      # The examples and probes are crates of their own. The web probe's manifest needs nightly, and its job checks it.
      - name: Crates outside the workspace
        run: |
          for manifest in $(git ls-files '*/Cargo.toml' | grep -v -e '^pushups-macros/' -e '^ci/web/probe/'); do
            cargo +stable fmt --check --manifest-path "$manifest"
          done
      # The Android module's version, which the runtime handshake compares, follows the crate's.
      - run: ci/check-versions.sh

  clippy:
    name: Clippy ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-ios
          - aarch64-apple-darwin
          - aarch64-linux-android
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add --toolchain stable ${{ matrix.target }}
      - name: Default features
        run: cargo +stable clippy --workspace --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: All features
        run: cargo +stable clippy --workspace --target ${{ matrix.target }} --all-targets --all-features -- -D warnings
      - name: An Android app forbidding unsafe code compiles, and misuse of its Context does not
        if: matrix.target == 'aarch64-linux-android'
        run: ci/android/compile-contract/check.sh ${{ matrix.target }}

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace
      - run: cargo +stable test --workspace --all-features

  test-windows:
    # No Windows App SDK runtime on the runner, so this runs the Windows backend as an app shipped without it.
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install 1.88 --profile minimal
          rustup target add --toolchain 1.88 aarch64-linux-android aarch64-apple-ios aarch64-apple-darwin x86_64-pc-windows-msvc
      # Every feature but `dioxus`, which needs the Rust version Dioxus 0.7 apps already need. A
      # check needs no linker, so the Windows target runs here too.
      - run: cargo +1.88 check --workspace --features stream,serde
      - run: cargo +1.88 check --workspace --features stream,serde,encryption --target aarch64-linux-android
      - run: cargo +1.88 check --workspace --features stream,serde,encryption --target aarch64-apple-ios
      - run: cargo +1.88 check --workspace --features stream,serde,encryption --target aarch64-apple-darwin
      - run: cargo +1.88 check --workspace --features stream,serde,encryption --target x86_64-pc-windows-msvc

  tauri-plugin:
    name: tauri-plugin-pushups
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri-plugin-pushups
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.90 --profile minimal
          rustup target add --toolchain stable aarch64-linux-android
      # Tauri builds on Linux against GTK and WebKitGTK.
      - uses: ./.github/actions/webkit-gtk
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets -- -D warnings
      # On Android the build script copies the crate's module, which this runs.
      - run: cargo +stable clippy --target aarch64-linux-android -- -D warnings
      - run: cargo +stable test --doc
      - run: cargo +1.90 check
      - name: The plugin is released at the crate's version
        run: test "$(cargo pkgid | sed 's/.*[#@]//')" = "$(cd .. && cargo pkgid -p pushups | sed 's/.*[#@]//')"

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  android-coverage:
    name: Android ${{ matrix.api }} on an emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 29 asks for no notification permission, 35 shows the Android 13 prompt.
        api: [29, 35]
    # Neither a fork's pull request nor a Dependabot run can read the Firebase secrets.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component llvm-tools,clippy,rustfmt
      - uses: ./.github/actions/android-emulator-prep
        with:
          target: x86_64-linux-android
          google-services-json: ci/android/probe/google-services.json
          google-services-json-secret: ${{ secrets.GOOGLE_SERVICES_JSON }}
          fcm-service-account: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      - name: Compile renamed macros with unsafe code forbidden on Android
        # The consumer checks offline, and Cargo still resolves sources for every target.
        run: |
          cargo +stable fetch
          CARGO_BUILD_TARGET=x86_64-linux-android cargo +stable test -p pushups-macros --target x86_64-unknown-linux-gnu --test renamed_dependency
      - name: Lint the probe under every configuration it is built with
        working-directory: ci/android/probe
        run: |
          cargo fmt --check
          for features in "" config-real "config-real background-handler" config-fixture config-mismatched; do
            cargo clippy --target x86_64-linux-android ${features:+--features "$features"} -- -D warnings
          done
      - name: Instrumented tests, through Firebase Cloud Messaging and through ntfy for UnifiedPush
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The runner image exports its NDK path as a shell variable, which `env` cannot read.
          script: |
            ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ci/android/run.sh x86_64 "$RUNNER_TEMP/fcm-service-account.json" android-${{ matrix.api }}
            ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash ci/android/rendering.sh x86_64 android-${{ matrix.api }}-rendering
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.api }}-coverage
          path: |
            target/android-${{ matrix.api }}-rust.lcov
            target/android-${{ matrix.api }}-rendering-rust.lcov
            target/android-${{ matrix.api }}-kotlin.xml
            target/android-${{ matrix.api }}-rendering-kotlin.xml
          if-no-files-found: error

  web-coverage:
    name: Web in Chrome and Firefox
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the probe's toolchain and its wasm-bindgen
        id: tools
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools,clippy,rustfmt --target wasm32-unknown-unknown
          version=$(grep -A1 '^name = "wasm-bindgen"$' ci/web/probe/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "wasm-bindgen=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/web-checkout
        with:
          tool: wasm-bindgen@${{ steps.tools.outputs.wasm-bindgen }}
      - name: Lint the probe
        working-directory: ci/web/probe
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
      - run: ci/web/build.sh
      - name: Chrome, through Firebase Cloud Messaging
        run: node ci/web/harness.mjs chrome target/web
      - name: Firefox, through Mozilla autopush
        run: FIREFOX_PATH="$(command -v firefox)" node ci/web/harness.mjs firefox target/web
      - run: ci/web/report.sh target/web target/web-rust.lcov target/web-shim.lcov
      - uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: target/web-*.lcov
          if-no-files-found: error

  linux-coverage:
    name: Linux through a UnifiedPush distributor
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # A fork's pull request gets no secrets, so it pulls anonymously.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component llvm-tools,clippy,rustfmt
      - name: Lint the probe
        working-directory: ci/linux/probe
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
      # GitHub's runners share Docker Hub's anonymous pull limit, which the image pull otherwise hits.
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # KDE's distributor in a Debian testing container, with real pushes through ntfy.sh.
      - run: ci/linux/run.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-coverage
          path: target/linux-rust.lcov
          if-no-files-found: error

  example-linux:
    name: Example apps on Linux through a UnifiedPush distributor
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: [winit, tauri]
    # A fork's pull request gets no secrets, so it pulls anonymously.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      # Tauri builds on Linux against GTK and WebKitGTK.
      - if: matrix.example == 'tauri'
        uses: ./.github/actions/webkit-gtk
      # GitHub's runners share Docker Hub's anonymous pull limit, which the image pull otherwise hits.
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The app in a window on Xvfb, KDE's distributor in a Debian testing container, real pushes through ntfy.sh.
      - name: Token, a push to the open app, a push to the closed app that the bus starts headless, the next window draining it
        run: ci/linux/example-host.sh ${{ matrix.example }}

  coverage:
    name: Coverage
    needs: [android-coverage, linux-coverage, web-coverage]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Neither a fork's pull request nor a Dependabot run can read CODECOV_TOKEN.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo +nightly llvm-cov --workspace --all-features --all-targets --no-report
      - run: cargo +nightly llvm-cov --workspace --all-features --doc --no-clean --lcov --output-path target/coverage.lcov
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-coverage"
          merge-multiple: true
          path: target
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage.lcov,target/android-29-rust.lcov,target/android-35-rust.lcov,target/android-29-rendering-rust.lcov,target/android-35-rendering-rust.lcov,target/android-29-kotlin.xml,target/android-35-kotlin.xml,target/android-29-rendering-kotlin.xml,target/android-35-rendering-kotlin.xml,target/linux-rust.lcov,target/web-rust.lcov,target/web-shim.lcov
          fail_ci_if_error: true

  example-android:
    name: Example APK
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      # The example compiles a Firebase configuration in, and the fixture stands in for the
      # real one, which never leaves the maintainer's machine.
      - run: cp tests/fixtures/google-services.json examples/dioxus/google-services.json
      - name: Build the APK, Gradle module included
        working-directory: examples/dioxus
        # The runner image exports its NDK path as a shell variable, which `env` cannot read.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" dx build --android --target aarch64-linux-android

  example-android-emulator:
    name: Example app on an Android emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Neither a fork's pull request nor a Dependabot run can read the Firebase secrets.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - uses: ./.github/actions/android-emulator-prep
        with:
          target: x86_64-linux-android
          google-services-json: examples/dioxus/google-services.json
          google-services-json-secret: ${{ secrets.GOOGLE_SERVICES_JSON }}
          fcm-service-account: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      - name: Build the APK for the emulator
        working-directory: examples/dioxus
        # The runner image exports its NDK path as a shell variable, which `env` cannot read.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" dx build --android --target x86_64-linux-android
      - name: Pushes to the open app and to one whose process was killed
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ci/android/example.sh examples/dioxus/target/dx/pushups-dioxus-example/debug/android/app/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/fcm-service-account.json"

  example-winit-android:
    name: Example winit app through Gradle on an Android emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Neither a fork's pull request nor a Dependabot run can read the Firebase secrets.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: ./.github/actions/android-emulator-prep
        with:
          target: x86_64-linux-android
          google-services-json: examples/winit/google-services.json
          google-services-json-secret: ${{ secrets.GOOGLE_SERVICES_JSON }}
          fcm-service-account: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      - name: Build the library with cargo-ndk and the APK with Gradle, the module found through cargo metadata
        working-directory: examples/winit
        # The runner image exports its NDK path as a shell variable, which `env` cannot read.
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t x86_64 -o android/app/src/main/jniLibs build
          (cd android && ./gradlew --no-daemon assembleDebug)
          # The module's build output stays out of the crate.
          test ! -e ../../android/build
          mkdir -p "$RUNNER_TEMP/apk" && cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/sources.apk"
      - name: Build the same APK against the module published as the pushups-android AAR
        run: |
          ci/maven/publish.sh local
          (cd examples/winit/android && ./gradlew --no-daemon clean assembleDebug -Ppushups.aar="$GITHUB_WORKSPACE/ci/maven/build/repo")
          cp examples/winit/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/aar.apk"
      - name: Pushes to the open app and to one whose process was killed, with the module from sources and from the AAR
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ci/android/example.sh "$RUNNER_TEMP/apk/sources.apk" "$RUNNER_TEMP/fcm-service-account.json" android.app.NativeActivity && ci/android/example.sh "$RUNNER_TEMP/apk/aar.apk" "$RUNNER_TEMP/fcm-service-account.json" android.app.NativeActivity

  example-tauri-android:
    name: Example Tauri app through tauri-plugin-pushups on an Android emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Neither a fork's pull request nor a Dependabot run can read the Firebase secrets.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.1
      - uses: ./.github/actions/android-emulator-prep
        with:
          target: x86_64-linux-android
          google-services-json: examples/tauri/google-services.json
          google-services-json-secret: ${{ secrets.GOOGLE_SERVICES_JSON }}
          fcm-service-account: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      - name: Generate the Android project and build the APK, the module coming from the plugin
        working-directory: examples/tauri
        # The runner image exports its NDK path as a shell variable, which `env` cannot read.
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android init --ci
          # The generated project carries Tauri's launcher icon until `tauri icon` writes the brand's into it.
          cargo tauri icon ../../assets/brand/tauri-icon.json
          cargo tauri android build --apk --debug --target x86_64
          # Tauri's own files land in the plugin's copy of the module, never in the crate.
          test ! -e ../../android/.tauri
      - name: Pushes to the open app and to one whose process was killed
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ci/android/example.sh "$(find examples/tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)" "$RUNNER_TEMP/fcm-service-account.json" .MainActivity

  example-web:
    name: Example web app in Chrome
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32-unknown-unknown
      - uses: ./.github/actions/web-checkout
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - run: cp tests/fixtures/google-services.json examples/dioxus/google-services.json
      - name: Build the web app in both worker modes
        working-directory: examples/dioxus
        run: |
          dx build --web --release --no-default-features --features web
          key=$(node ../../ci/web/example.mjs keys "$RUNNER_TEMP/vapid.json")
          PUSHUPS_WEB_WORKER=static PUSHUPS_VAPID_PUBLIC_KEY="$key" dx build --web --release --no-default-features --features web
          # The `dioxus` feature has dx copy the worker unchanged into the assets.
          cmp target/dx/pushups-dioxus-example/release/web/public/assets/pushups-sw.js ../../js/pushups-sw.js
      - name: The static-worker build in Chrome, with its manifest and real pushes
        run: node ci/web/example.mjs check examples/dioxus/target/dx/pushups-dioxus-example/release/web/public "$RUNNER_TEMP/vapid.json" '/assets/pushups-sw\.js\?pushups=static' --manifest

  example-trunk:
    name: Example ${{ matrix.name }} app on Trunk in Chrome
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: yew
            name: Yew
          - example: winit
            name: winit
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32-unknown-unknown
      - uses: ./.github/actions/web-checkout
        with:
          tool: trunk@0.21.14
      - name: Build the ${{ matrix.name }} app in both worker modes
        working-directory: examples/${{ matrix.example }}
        run: |
          key=$(node ../../ci/web/example.mjs keys "$RUNNER_TEMP/vapid.json")
          PUSHUPS_VAPID_PUBLIC_KEY="$key" trunk build --release --dist dist-rust
          PUSHUPS_WEB_WORKER=static PUSHUPS_VAPID_PUBLIC_KEY="$key" trunk build --release --dist dist-static
          # `build.rs` wrote `pushups::SERVICE_WORKER`, which the Trunk hook copied.
          cmp dist-static/pushups-sw.js ../../js/pushups-sw.js
      - name: The Rust-handler build in Chrome, with real pushes
        run: node ci/web/example.mjs check examples/${{ matrix.example }}/dist-rust "$RUNNER_TEMP/vapid.json" '/sw\.js\?pushups=rust' --rust
      - name: The static-worker build in Chrome, with real pushes
        run: node ci/web/example.mjs check examples/${{ matrix.example }}/dist-static "$RUNNER_TEMP/vapid.json" '/pushups-sw\.js\?pushups=static'

  example-leptos:
    name: Example Leptos SSR app in Chrome
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32-unknown-unknown
      - uses: ./.github/actions/web-checkout
        with:
          tool: cargo-leptos@0.3.11
      - name: Both worker modes, served by the app's own server, with real pushes
        run: ci/web/leptos.sh

  mobile-rendering-apple:
    name: iOS notification service rendering
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-apple-ios-sim aarch64-apple-ios
      # The harness's keychain cases need the Developer ID identity and the profile for
      # rs.pushups.ci.harness, which neither a fork's pull request nor a Dependabot run can read.
      - name: Install the harness's signing identity
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        env:
          P12: ${{ secrets.MACOS_HARNESS_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_HARNESS_P12_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_HARNESS_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/harness.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/harness.p12"
          security import "$RUNNER_TEMP/harness.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/harness.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign finds an identity only in a keychain on the user's search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/harness.provisionprofile"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity"
          {
            echo "PUSHUPS_HARNESS_IDENTITY=$identity"
            echo "PUSHUPS_HARNESS_KEYCHAIN=$keychain"
            echo "PUSHUPS_HARNESS_PROFILE=$RUNNER_TEMP/harness.provisionprofile"
            echo "PUSHUPS_HARNESS_TEAM=7W8527FJJE"
          } >> "$GITHUB_ENV"
      - name: Exercise the native service and link the simulator extension
        run: bash ci/apple/run.sh

  example-apple:
    name: Example apps for iOS and macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-apple-ios aarch64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - run: cp tests/fixtures/google-services.json examples/dioxus/google-services.json
      # Each app exports its background handler, which the crate finds by name, so the linker must keep it.
      - name: Build each app, unsigned, and check the background handler is exported
        run: |
          for app in dioxus tao winit; do
            desktop=()
            if [ "$app" = dioxus ]; then desktop=(--no-default-features --features desktop); fi
            (cd "examples/$app" && dx build --ios --target aarch64-apple-ios && dx build --macos --target aarch64-apple-darwin "${desktop[@]}")
            binaries=$(find "examples/$app/target/dx" -path "*.app/*" -type f -name "pushups-$app-example")
            test "$(echo "$binaries" | wc -l)" -eq 2
            for binary in $binaries; do
              nm -gU "$binary" | grep -q ___pushups_background_handler || { echo "no background handler in $binary"; exit 1; }
            done
          done
      # The Tauri build needs its CLI, and CI has no signing identity, so the app comes out unsigned.
      - name: Build the Tauri app, unsigned, and check the handler and the aps-environment entitlement
        run: |
          cargo install tauri-cli --locked --version 2.12.1
          (cd examples/tauri && cargo tauri build --debug --bundles app)
          app=$(find examples/tauri/target/debug/bundle/macos -maxdepth 1 -name "*.app" | head -n1)
          binary="$app/Contents/MacOS/pushups-tauri-example"
          nm -gU "$binary" | grep -q ___pushups_background_handler || { echo "no background handler in $binary"; exit 1; }
          entitlements=$(codesign -d --entitlements - "$binary" 2>/dev/null || true)
          if [ -n "$entitlements" ]; then
            echo "$entitlements" | grep -q "com.apple.developer.aps-environment" || { echo "no aps-environment in the Tauri app entitlements"; exit 1; }
          else
            # An unsigned build applies no entitlements, so check the file the signed build applies.
            grep -q "com.apple.developer.aps-environment" examples/tauri/entitlements.plist || { echo "no aps-environment in examples/tauri/entitlements.plist"; exit 1; }
          fi
