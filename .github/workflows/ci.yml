---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check

  clippy:
    name: Clippy ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-ios
          - aarch64-apple-darwin
          - aarch64-linux-android
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add --toolchain stable ${{ matrix.target }}
      - name: Default features
        run: cargo +stable clippy --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: All features
        run: cargo +stable clippy --target ${{ matrix.target }} --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test
      - run: cargo +stable test --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 check --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Neither a fork's pull request nor a Dependabot run can read CODECOV_TOKEN.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo +nightly llvm-cov --all-features --all-targets --no-report
      - run: cargo +nightly llvm-cov --all-features --doc --no-clean --lcov --output-path target/coverage.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage.lcov
          fail_ci_if_error: true
