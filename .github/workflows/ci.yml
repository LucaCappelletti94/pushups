---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check

  clippy:
    name: Clippy ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-ios
          - aarch64-apple-darwin
          - aarch64-linux-android
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add --toolchain stable ${{ matrix.target }}
      - name: Default features
        run: cargo +stable clippy --workspace --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: All features
        run: cargo +stable clippy --workspace --target ${{ matrix.target }} --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace
      - run: cargo +stable test --workspace --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install 1.85 --profile minimal
          rustup target add --toolchain 1.85 aarch64-linux-android
      - run: cargo +1.85 check --workspace --all-features
      - run: cargo +1.85 check --workspace --all-features --target aarch64-linux-android

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  android-coverage:
    name: Android ${{ matrix.api }} on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 29 asks for no notification permission, 35 shows the Android 13 prompt.
        api: [29, 35]
    # Neither a fork's pull request nor a Dependabot run can read the Firebase secrets.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          rustup toolchain install stable --profile minimal --component llvm-tools,clippy,rustfmt
          rustup target add --toolchain stable x86_64-linux-android
      # The emulator needs KVM, which the runner's user cannot open by default.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the Firebase configuration and the FCM key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > ci/android/probe/google-services.json
          printf '%s' "$FCM_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fcm-service-account.json"
      - name: Lint the probe under every configuration it is built with
        working-directory: ci/android/probe
        run: |
          cargo fmt --check
          for features in "" config-real "config-real background-handler" config-fixture config-mismatched; do
            cargo clippy --target x86_64-linux-android ${features:+--features "$features"} -- -D warnings
          done
      - name: Instrumented tests, through Firebase Cloud Messaging
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The runner image exports its NDK path as a shell variable, which `env` cannot read.
          script: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ci/android/run.sh x86_64 "$RUNNER_TEMP/fcm-service-account.json" android-${{ matrix.api }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.api }}-coverage
          path: |
            target/android-${{ matrix.api }}-rust.lcov
            target/android-${{ matrix.api }}-kotlin.xml
          if-no-files-found: error

  coverage:
    name: Coverage and Sonar
    needs: android-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Neither a fork's pull request nor a Dependabot run can read CODECOV_TOKEN or SONAR_TOKEN.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar attributes new code through blame, which needs the full history.
          fetch-depth: 0
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo +nightly llvm-cov --workspace --all-features --all-targets --no-report
      - run: cargo +nightly llvm-cov --workspace --all-features --doc --no-clean --lcov --output-path target/coverage.lcov
      - uses: actions/download-artifact@v8
        with:
          pattern: "android-*-coverage"
          merge-multiple: true
          path: target
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage.lcov,target/android-29-rust.lcov,target/android-35-rust.lcov,target/android-29-kotlin.xml,target/android-35-kotlin.xml
          fail_ci_if_error: true
      # The Sonar analyzer runs clippy itself.
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  example-android:
    name: Example APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      # The example compiles a Firebase configuration in, and the fixture stands in for the
      # real one, which never leaves the maintainer's machine.
      - run: cp tests/fixtures/google-services.json examples/dioxus/google-services.json
      - name: Build the APK, Gradle module included
        working-directory: examples/dioxus
        # The runner image exports its NDK path as a shell variable, which `env` cannot read.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" dx build --android --target aarch64-linux-android
