name: Release

# A `v<version>` tag publishes the crates, then the AAR; run by hand, both only dry-run.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates:
    name: Publish pushups-macros and pushups to crates.io
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: The tag, the crate and the Android module carry one version
        if: startsWith(github.ref, 'refs/tags/')
        run: ci/check-versions.sh "$GITHUB_REF_NAME"
      - name: Authenticate with crates.io
        if: startsWith(github.ref, 'refs/tags/')
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish -p pushups-macros -p pushups ${{ !startsWith(github.ref, 'refs/tags/') && '--dry-run' || '' }}

  aar:
    name: Publish the Android module to Maven Central
    # The module's handshake refuses every crate version but its own, so it never ships without its crate.
    needs: crates
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install stable --profile minimal
      - name: Build, sign and upload
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ci/maven/publish.sh ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dry-run' }}
