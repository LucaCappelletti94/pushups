---
name: echoes-post

"on":
  workflow_run:
    workflows: [echoes]
    types: [completed]

permissions: {}

jobs:
  review:
    name: Review the duplicates a pull request adds
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      # Resolving the review threads of copies the pull request removed.
      contents: write
      pull-requests: write
    # This job holds a write token, so it checks out nothing and treats the payload as data.
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: echoes-payload
          path: ${{ runner.temp }}/echoes-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: LucaCappelletti94/cargo-echoes@14ca2c9fa250b4eb8cd59c47f187b1f2281fb484  # v1.10.4
        with:
          mode: post
          payload: ${{ runner.temp }}/echoes-payload
