name: Windows push

# Real WNS pushes with the repository's Entra ID secrets, which pull requests from forks never get.
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  w0:
    name: W0
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Install the Windows App SDK 2.5 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest -TimeoutSec 600 -OutFile $installer 'https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe'
          $install = Start-Process $installer -ArgumentList '--quiet' -NoNewWindow -PassThru
          # The handle is taken now so the exit code stays readable.
          $null = $install.Handle
          if (-not $install.WaitForExit(600000)) { $install.Kill(); throw 'the runtime installer did not finish within 10 minutes' }
          if ($install.ExitCode -ne 0) { throw "the runtime installer exited with $($install.ExitCode)" }
      - run: cargo +stable build --release --manifest-path ci/windows/w0/Cargo.toml
      - name: W0
        shell: pwsh
        env:
          WNS_TENANT_ID: ${{ secrets.WNS_TENANT_ID }}
          WNS_APP_ID: ${{ secrets.WNS_APP_ID }}
          WNS_OBJECT_ID: ${{ secrets.WNS_OBJECT_ID }}
          WNS_CLIENT_SECRET: ${{ secrets.WNS_CLIENT_SECRET }}
        run: ./ci/windows/w0.ps1
