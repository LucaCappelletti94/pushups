name: Windows push

# Real WNS pushes with the repository's Entra ID secrets, which pull requests from forks never get.
"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  w0:
    name: W0
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Install the Windows App SDK 2.5 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest -TimeoutSec 600 -OutFile $installer 'https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe'
          $install = Start-Process $installer -ArgumentList '--quiet' -NoNewWindow -PassThru
          # The handle is taken now so the exit code stays readable.
          $null = $install.Handle
          if (-not $install.WaitForExit(600000)) { $install.Kill(); throw 'the runtime installer did not finish within 10 minutes' }
          if ($install.ExitCode -ne 0) { throw "the runtime installer exited with $($install.ExitCode)" }
      - run: cargo +stable build --release --manifest-path ci/windows/w0/Cargo.toml
      - name: W0
        shell: pwsh
        env:
          WNS_TENANT_ID: ${{ secrets.WNS_TENANT_ID }}
          WNS_APP_ID: ${{ secrets.WNS_APP_ID }}
          WNS_OBJECT_ID: ${{ secrets.WNS_OBJECT_ID }}
          WNS_CLIENT_SECRET: ${{ secrets.WNS_CLIENT_SECRET }}
        run: ./ci/windows/w0.ps1
  w1:
    name: W1
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component llvm-tools
      - name: Install the Windows App SDK 2.5 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest -TimeoutSec 600 -OutFile $installer 'https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe'
          $install = Start-Process $installer -ArgumentList '--quiet' -NoNewWindow -PassThru
          # The handle is taken now so the exit code stays readable.
          $null = $install.Handle
          if (-not $install.WaitForExit(600000)) { $install.Kill(); throw 'the runtime installer did not finish within 10 minutes' }
          if ($install.ExitCode -ne 0) { throw "the runtime installer exited with $($install.ExitCode)" }
      - name: Build the W1 probe instrumented for coverage
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-Cinstrument-coverage'
          cargo +stable build --manifest-path ci/windows/w1/Cargo.toml
          Remove-Item Env:RUSTFLAGS
      - name: W1
        shell: pwsh
        env:
          WNS_TENANT_ID: ${{ secrets.WNS_TENANT_ID }}
          WNS_APP_ID: ${{ secrets.WNS_APP_ID }}
          WNS_OBJECT_ID: ${{ secrets.WNS_OBJECT_ID }}
          WNS_CLIENT_SECRET: ${{ secrets.WNS_CLIENT_SECRET }}
          LLVM_PROFILE_FILE: ${{ runner.temp }}/w1/prof/%m.profraw
        run: ./ci/windows/w1.ps1
      - name: Write the Rust LCOV
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'w1'
          $exe = Join-Path $work 'app\pushups-w1-probe.exe'
          $hostTriple = (rustc -vV | Select-String -Pattern '^host: ').Line -replace '^host: ', ''
          $tools = Join-Path (rustc --print sysroot) "lib\rustlib\$hostTriple\bin"
          $profraw = @()
          foreach ($dir in @(Join-Path $work 'prof'), (Join-Path $work 'app')) {
            $profraw += @(Get-ChildItem -Path $dir -Filter '*.profraw' -ErrorAction SilentlyContinue).FullName
          }
          if ($profraw.Count -eq 0) { throw 'no Rust profile written' }
          $profdata = Join-Path $work 'pushups.profdata'
          & (Join-Path $tools 'llvm-profdata.exe') merge -sparse @profraw -o $profdata
          $root = $env:GITHUB_WORKSPACE
          & (Join-Path $tools 'llvm-cov.exe') export -format=lcov -instr-profile $profdata $exe "$root\src" |
            ForEach-Object { $_ -replace '^SF:.*[/\\]src[/\\]', 'SF:src/' } |
            ForEach-Object { $_ -replace '\\', '/' } |
            Set-Content -Path (Join-Path $root 'target\windows-w1-rust.lcov') -Encoding ascii
          if (-not (Select-String -Path (Join-Path $root 'target\windows-w1-rust.lcov') -Pattern '^SF:src/' -Quiet)) {
            throw 'no src/ file in the Rust LCOV'
          }
      - name: Upload the Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/windows-w1-rust.lcov
          fail_ci_if_error: true
      - name: The screens where no banner was clicked
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: w1-screens
          path: ${{ runner.temp }}/w1/screens
          if-no-files-found: ignore
  example:
    name: Example (${{ matrix.example }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      matrix:
        example: [dioxus, tauri, winit]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Install the Windows App SDK 2.5 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest -TimeoutSec 600 -OutFile $installer 'https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe'
          $install = Start-Process $installer -ArgumentList '--quiet' -NoNewWindow -PassThru
          # The handle is taken now so the exit code stays readable.
          $null = $install.Handle
          if (-not $install.WaitForExit(600000)) { $install.Kill(); throw 'the runtime installer did not finish within 10 minutes' }
          if ($install.ExitCode -ne 0) { throw "the runtime installer exited with $($install.ExitCode)" }
      - name: Build the ${{ matrix.example }} example
        shell: pwsh
        env:
          EXAMPLE: ${{ matrix.example }}
          PUSHUPS_WNS_REMOTE_ID: ${{ secrets.WNS_OBJECT_ID }}
        run: |
          # The Dioxus example's `firebase_config!` reads this file on every target.
          Copy-Item tests/fixtures/google-services.json "examples/$env:EXAMPLE/google-services.json"
          $map = @{
            dioxus = @{ Manifest = 'examples/dioxus/Cargo.toml'; Args = @('--no-default-features', '--features', 'desktop') }
            tauri = @{ Manifest = 'examples/tauri/Cargo.toml'; Args = @() }
            winit = @{ Manifest = 'examples/winit/Cargo.toml'; Args = @() }
          }
          $entry = $map[$env:EXAMPLE]
          $buildArgs = $entry.Args
          cargo +stable build --release --manifest-path $entry.Manifest @buildArgs
      - name: Run the ${{ matrix.example }} example with WNS pushes
        shell: pwsh
        env:
          WNS_TENANT_ID: ${{ secrets.WNS_TENANT_ID }}
          WNS_APP_ID: ${{ secrets.WNS_APP_ID }}
          WNS_OBJECT_ID: ${{ secrets.WNS_OBJECT_ID }}
          WNS_CLIENT_SECRET: ${{ secrets.WNS_CLIENT_SECRET }}
        run: |
          ./ci/windows/example.ps1 "$env:GITHUB_WORKSPACE\examples\${{ matrix.example }}\target\release\pushups-${{ matrix.example }}-example.exe"
