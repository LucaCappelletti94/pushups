---
name: echoes

"on": pull_request

permissions:
  contents: read

jobs:
  scan:
    name: Duplicates a pull request adds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # The scan runs without write access, so echoes-post.yml reviews fork pull requests too.
      - uses: LucaCappelletti94/cargo-echoes@fe825077e5322a8bd3fa82c8c5a55f2d49cbe016  # v1.10.2
        with:
          pr-number: ${{ github.event.pull_request.number }}
          mode: prepare
          payload: ${{ runner.temp }}/echoes-payload
      - uses: actions/upload-artifact@v7
        with:
          name: echoes-payload
          path: ${{ runner.temp }}/echoes-payload
          if-no-files-found: error
