name: Android AAR

# A `v<version>` tag publishes io.github.lucacappelletti94:pushups-android at that version to Maven
# Central. Run by hand, it uploads the same signed bundle for Central's validation and drops it.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aar:
    name: Publish the Android module to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install stable --profile minimal
      - name: The tag, the crate and the Android module carry one version
        if: startsWith(github.ref, 'refs/tags/')
        run: ci/check-versions.sh "$GITHUB_REF_NAME"
      - name: Build, sign and upload
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ci/maven/publish.sh ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dry-run' }}
