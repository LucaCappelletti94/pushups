# Keys of the SonarQube Cloud project, which must match its import exactly.
sonar.organization=lucacappelletti94-github
sonar.projectKey=LucaCappelletti94_pushups
sonar.projectName=pushups

sonar.sources=src,pushups-macros/src,android/src/main
sonar.exclusions=target/**
sonar.sourceEncoding=UTF-8

sonar.rust.cargo.manifestPaths=Cargo.toml
# Written by the cargo llvm-cov steps of the Coverage and Sonar job, and by ci/android/run.sh on the emulator.
sonar.rust.lcov.reportPaths=target/coverage.lcov,target/android-rust.lcov
# The Kotlin module's coverage on the emulator, from ci/android/run.sh.
sonar.coverage.jacoco.xmlReportPaths=target/android-kotlin.xml

# A library manifest leaves backup and clear-text traffic to the app's own manifest.
sonar.issue.ignore.multicriteria=backup,cleartext
sonar.issue.ignore.multicriteria.backup.ruleKey=xml:S6358
sonar.issue.ignore.multicriteria.backup.resourceKey=android/src/main/AndroidManifest.xml
sonar.issue.ignore.multicriteria.cleartext.ruleKey=xml:S5332
sonar.issue.ignore.multicriteria.cleartext.resourceKey=android/src/main/AndroidManifest.xml
