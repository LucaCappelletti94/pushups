[package]
name = "pushups"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Receive push notifications in a Rust app: APNs on iOS and macOS, FCM on Android, WNS on Windows, UnifiedPush on Linux, Web Push in the browser, under any toolkit"
repository = "https://github.com/LucaCappelletti94/pushups"
license = "MIT"
readme = "README.md"
keywords = ["push", "notifications", "apns", "fcm", "webpush"]
categories = ["api-bindings", "os", "wasm"]
exclude = ["/assets"]
# Unique in a build, so `build.rs` can hand the Android module's path to direct dependents.
links = "pushups"

[features]
stream = ["dep:futures-channel", "dep:futures-core"]
# Lets `dx` bundle the Android module and the static service worker from this crate.
dioxus = ["dep:manganis"]
# `Serialize` and `Deserialize` on `Token`, and `Serialize` on `WebPushSubscription` in the shape of
# the browser's `PushSubscription.toJSON()`.
serde = ["pushups-token/serde"]
# The keys the device decrypts its pushes with, in the platform key store, and the decryption
# of every envelope before the app's callbacks, on Android, iOS, macOS and Windows.
encryption = [
    "dep:aes-gcm",
    "dep:getrandom",
    "dep:hkdf",
    "dep:keyring-core",
    "dep:p256",
    "dep:sha2",
    "dep:android-native-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
]

[workspace]
members = ["pushups-macros", "pushups-sender", "pushups-token"]
# Built in its own workspace, since `tauri` needs GTK on Linux, Rust 1.90 and no wasm32.
exclude = ["tauri-plugin-pushups"]

[dependencies]
# The RFC 8291 crypto, optional here and unconditional on Linux, which keeps its own copies for
# the `UnifiedPush` connector.
aes-gcm = { version = "0.11", optional = true }
# Its `wasm_js` backend, so the `encryption` feature builds on a bare wasm target.
getrandom = { version = "0.4", optional = true, features = ["wasm_js"] }
hkdf = { version = "0.13", optional = true }
p256 = { version = "0.14", optional = true, features = ["ecdh"] }
sha2 = { version = "0.11", optional = true }
futures-channel = { version = "0.3", optional = true, default-features = false, features = ["std"] }
futures-core = { version = "0.3", optional = true, default-features = false }
parking_lot = "0.12"
pushups-macros = { version = "0.1.0", path = "pushups-macros" }
pushups-token = { version = "0.1.0", path = "pushups-token" }
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
jni = "0.21"
# The branch of PR 50, pinned until its release, which this crate's publishing waits for.
android-native-keyring-store = { git = "https://github.com/open-source-cooperative/android-native-keyring-store", rev = "56f0c537a7c1", optional = true }

[target.'cfg(any(target_os = "android", all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# The `dioxus` the app depends on resolves this to its own version.
manganis = { version = "0.7", optional = true }

[target.'cfg(unix)'.dependencies]
# `flock`, which keeps the queue file to one owner process, and `dlsym` on Apple.
libc = "0.2"

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos", target_os = "windows"))'.dependencies]
keyring-core = { version = "1", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true, features = ["protected"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2"] }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSJSONSerialization", "NSKeyValueObserving", "NSNotification", "NSObject", "NSOperation", "NSPathUtilities", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "UIApplication", "UIResponder"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSResponder", "NSWorkspace"] }

[target.'cfg(target_os = "linux")'.dependencies]
aes-gcm = "0.11"
getrandom = "0.4"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdh"] }
sha2 = "0.11"
zbus = "5"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
linkme = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# The newest 0.6x line that builds on Rust 1.88, since the 0.100 line of `windows-core` needs 1.95.
# The `IMap` that `AppNotificationActivatedEventArgs` returns for `Arguments` and `UserInput`.
windows = { version = "0.62", default-features = false, features = ["Foundation", "Foundation_Collections", "ApplicationModel_Background", "ApplicationModel_Core", "System"] }
windows-collections = "0.3"
windows-core = "0.62"
windows-future = "0.3"
windows-link = "0.2"
windows-native-keyring-store = { version = "1.1.0", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Navigator", "Node", "Notification", "RegistrationOptions", "ServiceWorkerContainer", "ServiceWorkerRegistration", "Url", "UrlSearchParams", "Window", "console"] }

[dev-dependencies]
# The reference decoder the base64url tests compare against.
base64 = "0.22"
# The public key derivation of tests/linux_notifications.rs.
p256 = { version = "0.14", features = ["ecdh"] }
futures-executor = "0.3"
keyring-core = { version = "1" }
pushups-sender = { path = "pushups-sender" }
serde_json = "1"
tempfile = "3"
# The fake distributor of tests/linux.rs.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "5"

# Runs itself as the app on a private session bus, so it needs its own main.
[[test]]
name = "linux"
harness = false

[[test]]
name = "linux_notifications"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
