[package]
name = "pushups"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Receive push notifications in a Rust app: APNs on iOS and macOS, FCM on Android, WNS on Windows, Web Push in the browser, under any toolkit"
repository = "https://github.com/LucaCappelletti94/pushups"
license = "MIT"
readme = "README.md"
keywords = ["push", "notifications", "apns", "fcm", "webpush"]
categories = ["api-bindings", "os", "wasm"]

[features]
stream = ["dep:futures-channel", "dep:futures-core"]

[dependencies]
futures-channel = { version = "0.3", optional = true, default-features = false, features = ["std"] }
futures-core = { version = "0.3", optional = true, default-features = false }
parking_lot = "0.12"
thiserror = "2"

[dev-dependencies]
futures-executor = "0.3"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
