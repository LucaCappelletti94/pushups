[package]
name = "pushups-linux-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Built only by ci/linux/run.sh, the probe with `-Cinstrument-coverage`, so it stays out of the crate's workspace.
[workspace]

[[bin]]
name = "pushups-linux-probe"
path = "src/main.rs"

# Sends a Web Push with the `web-push` crate, an implementation independent of the one under test.
[[bin]]
name = "send"
path = "src/send.rs"

# Stands in for a desktop's notification server, which the test bed lacks.
[[bin]]
name = "notifier"
path = "src/notifier.rs"

[dependencies]
pushups = { path = "../../..", features = ["serde"] }
pushups-probe-support = { path = "../../probe-support" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
web-push = "0.11"
zbus = "5"
