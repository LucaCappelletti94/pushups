[package]
name = "pushups-apple-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
pushups = { path = "../../..", features = ["encryption"] }
pushups-sender = { path = "../../../pushups-sender" }
serde_json = "1"
thiserror = "2"
p256 = "0.14"
keyring-core = "1"
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
