[package]
name = "pushups-token"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The push token pushups reports and an app server sends to, shared by pushups and pushups-sender"
repository = "https://github.com/LucaCappelletti94/pushups"
license = "MIT"
readme = "README.md"
keywords = ["push", "notifications", "apns", "fcm", "webpush"]
categories = ["encoding", "web-programming"]

[features]
# `Serialize` and `Deserialize` on `Token`, and `Serialize` on `WebPushSubscription`.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
# The reference decoder the base64url tests compare against.
base64 = "0.22"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
