[package]
name = "pushups-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Macros for pushups"
repository = "https://github.com/LucaCappelletti94/pushups"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
# Finds the name the calling crate gives its `pushups` dependency.
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
