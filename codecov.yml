coverage:
  status:
    # Emulator and browser runs leave defensive paths, such as a library that fails to load, unreached.
    project:
      default:
        target: 85%
    patch:
      default:
        target: 85%

# The README is the crate docs, and its doctests reach no push handler, so its lines are no code to cover.
ignore:
  - README.md
